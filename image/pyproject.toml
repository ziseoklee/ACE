[project]
name = "ace-image"
description = "On the Collapse of Generative Paths: A Criterion and Correction for Diffusion Steering"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==4.55.4",
    "accelerate>=1.8.1",
    "numpy>=2.1.0",
    "opencv-python>=4.10.0.84",
    "pillow>=11.3.0",
    "protobuf>=6.32.0",
    "diffusers==0.35.1",
    "hydra-core>=1.3.2",
    "groundingdino-py==0.4.0",
]


[project.scripts]
# ACE paper reproduction (HFKC is retained as a compatibility alias)
gen-mig-box-ace = "experiments.bench_coco_mig.generate_mig_textbox2img_ace:main"
gen-mig-box-hfkc = "experiments.bench_coco_mig.generate_mig_textbox2img_hfkc:main"


[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv]
index-strategy = "unsafe-best-match"


[tool.ruff]
line-length = 120
target-version = "py311"


[tool.setuptools.packages.find]
where = ["src"]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
