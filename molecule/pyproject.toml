[project]
name = "ace-for-sbdd"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
maintainers = [
    { name = "Wooyeol Lee", email = "wooyeol0519@snu.ac.kr" }
]
dependencies = [
    "hydra-core>=1.3.2",
    "jaxtyping>=0.2.19",
    "numpy>=1.24.4",
    "rdkit>=2024.3.5",
    "scipy>=1.13.1",
    "torch==2.4.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
experts = [
    "diffsbdd",
    "e3-diffusion-for-molecules",
    "geodiff",
]
pytorch-geometric = [
    "torch-cluster==1.6.3+pt24cu121",
    "torch-geometric==2.6.1",
    "torch-scatter==2.1.2+pt24cu121",
    "torch-sparse==0.6.18+pt24cu121",
    "torch-spline-conv==1.2.2+pt24cu121",
]

[tool.uv]
default-groups = ["experts", "pytorch-geometric"]
find-links = [
    "https://data.pyg.org/whl/torch-2.4.0+cu121.html"
]

[tool.uv.sources]
diffsbdd = { path = "src/pretrained_models/DiffSBDD", editable = false }
"e3-diffusion-for-molecules" = { path = "src/pretrained_models/e3_diffusion_for_molecules", editable = false }
geodiff = { path = "src/pretrained_models/GeoDiff", editable = false }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "configs*",
    "experts*",
    "inference*",
    "sampling*",
    "utils*",
    "postprocessing*",
]
namespaces = true

[tool.setuptools.package-data]
configs = ["*.yaml"]


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "data", # Exclude the data directory, which contains large datasets and is not part of the source code.
    # Exclude the source code of DiffSBDD, e3_diffusion_for_molecules, and GeoDiff, which are copied from their original repositories and not modified.
    "src/pretrained_models/DiffSBDD", 
    "src/pretrained_models/e3_diffusion_for_molecules",
    "src/pretrained_models/GeoDiff"
]

line-length = 120
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# We use additional rules named Isort (`I`), Pyupgrade (`UP`), and pep8-naming (`N`).
select = ["E4", "E7", "E9", "F", "I", "UP", "N"]
ignore = ["F722"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
