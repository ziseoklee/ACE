[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geodiff"
version = "0.0.0"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
packages = [
    "geodiff",
    "geodiff.models",
    "geodiff.models.encoder",
    "geodiff.models.epsnet",
    "geodiff.utils",
    "geodiff.utils.evaluation",
]

[tool.setuptools.package-dir]
geodiff = "."
"geodiff.models" = "models"
"geodiff.models.encoder" = "models/encoder"
"geodiff.models.epsnet" = "models/epsnet"
"geodiff.utils" = "utils"
"geodiff.utils.evaluation" = "utils/evaluation"
