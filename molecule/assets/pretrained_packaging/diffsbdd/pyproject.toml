[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsbdd"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = []

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.4.0+cu121.html"
]


[tool.setuptools]
packages = [
    "diffsbdd",
    "diffsbdd.analysis",
    "diffsbdd.analysis.SA_Score",
    "diffsbdd.data",
    "diffsbdd.equivariant_diffusion",
]

[tool.setuptools.package-dir]
diffsbdd = "."
"diffsbdd.analysis" = "analysis"
"diffsbdd.analysis.SA_Score" = "analysis/SA_Score"
"diffsbdd.data" = "data"
"diffsbdd.equivariant_diffusion" = "equivariant_diffusion"
