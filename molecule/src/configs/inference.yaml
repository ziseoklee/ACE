defaults:
  - sampler: ACESampler
  - moe: DefaultMoE
  - weight@moe.exponents.edm_fragment.weight_fn: ConstantWeight
  - weight@moe.exponents.edm_ligand.weight_fn: ConstantWeight
  - weight@moe.exponents.geodiff_fragment.weight_fn: ConstantWeight
  - weight@moe.exponents.diffsbdd.weight_fn: ACEBumpWeight
  - moe_component@moe.components.edm_fragment: EDM_QM9_FRAGMENT
  - moe_component@moe.components.edm_ligand: EDM_QM9_LIGAND
  - moe_component@moe.components.geodiff_fragment: GEODIFF_QM9_FRAGMENT
  - moe_component@moe.components.diffsbdd: DIFFSBDD_CROSSDOCKED_FULLATOM_COND
  - _self_

data:
  protein_pocket_pdb_path: examples/4m7t_pocket.pdb
  fragment_sdf_path: examples/4m7t_fragment.sdf
  ligand_sdf_path: examples/4m7t_ligand.sdf
  # If null, use the reference ligand atom count. Otherwise, sample a ligand with this many atoms.
  num_ligand_atoms: null

# Shared omega and ACE exponent definitions.
moe:
  omega: ???
  global_scheduler_key: GEODIFF
  # WARNING/FIXME: This empirical multiplier works well in DiffSBDD and
  # 4-expert MoE inference, but not consistently in EDM-only or GeoDiff-only
  # inference. The reason for the default value 2.0 is not yet fully understood.
  diffusion_scale: 2.0
  exponents:
    edm_fragment:
      weight_scale: -1.0
      constant: 0.0
      weight_fn:
        omega: ${moe.omega}
    edm_ligand:
      weight_scale: -1.0
      constant: 1.0
      weight_fn:
        omega: ${moe.omega}
    geodiff_fragment:
      weight_scale: 1.0
      constant: 0.0
      weight_fn:
        omega: ${moe.omega}
    diffsbdd:
      weight_scale: 1.0
      constant: 0.0
      weight_fn:
        omega: ${moe.omega}
        B1: 30
        B2: 0.336

# If null, will use Hydra's default output directory. Otherwise, specify a custom output directory.
output_dir: null
