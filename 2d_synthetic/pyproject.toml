[project]
name = "ace-2d-synthetic"
version = "0.1.0"
description = "Synthetic checker experiments for Adaptive Path Correction with Exponents (ACE)"
requires-python = "==3.11.*"
dependencies = [
    "ipykernel>=6.29.5",
    "ipython==9.10.0",
    "jupyterlab>=4.4.0",
    "matplotlib==3.10.8",
    "numpy>=2.0,<3",
    "pandas==3.0.0",
    "pot==0.9.6.post1",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "torch==2.6.0",
    "tqdm==4.66.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ace_lib*"]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "NPY", "UP", "B", "SIM"]
ignore = ["E741"]
